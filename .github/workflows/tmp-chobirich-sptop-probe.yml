name: tmp Chobirich SPTOP probe

on:
  push:
    branches: [tmp/chobirich-sptop-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe legacy official SPTOP ranking endpoint
        shell: bash
        run: |
          set -euo pipefail
          url='https://www.chobirich.com/logreco/ranking?logreco%5Bresponse_number%5D=15&logreco%5Bmethod_type%5D=2&logreco%5Bspot_name%5D=SPTOP_ranking&logreco%5Bcategory1%5D=%E3%81%8A%E8%B2%B7%E3%81%84%E7%89%A9%E3%81%A7%E8%B2%AF%E3%82%81%E3%82%8B'
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
          code=$(curl --silent --show-error --location --output "$RUNNER_TEMP/chobi.html" --write-out '%{http_code}'             --user-agent "$ua"             --header 'Accept: text/html, */*;q=0.9'             --header 'Referer: https://www.chobirich.com/'             --header 'X-Requested-With: XMLHttpRequest'             "$url")
          bytes=$(wc -c < "$RUNNER_TEMP/chobi.html" | tr -d ' ')
          markers=$(grep -o 'CommonRankingBox__item' "$RUNNER_TEMP/chobi.html" | wc -l | tr -d ' ' || true)
          echo "HTTP=$code"
          echo "BYTES=$bytes"
          echo "RANKING_MARKERS=$markers"
          head -c 300 "$RUNNER_TEMP/chobi.html" | tr '\n' ' ' || true
          echo
          test "$code" = 200
          test "$markers" -gt 0
