name: Refresh and publish POI DAYS

on:
  schedule:
    # UTC 21:05 = JST 06:05. Active only after this file reaches main.
    - cron: '5 21 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      chobirich_html:
        description: 'Optional UTF-8 Chobirich ranking fragment captured by an approved device'
        required: false
        default: ''
        type: string
      chobirich_base64:
        description: 'Optional Base64 raw Chobirich ranking fragment captured by an approved device'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# All production builds/deployments share one queue. Never cancel a live deploy.
concurrency:
  group: poi-days-pages-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.repository == '100things-project/poi-days'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A queued run always builds current main, not a superseded push revision.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch the preservation baseline only
        run: git fetch --no-tags --depth=1 origin 4d204a18d2e5afc3514a55b45d164268edbbb12c

      - name: Verify current Pages configuration without changing it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/100things-project/poi-days/pages --jq .build_type > "$RUNNER_TEMP/poi-pages-build-type"
          test "$(cat "$RUNNER_TEMP/poi-pages-build-type")" = workflow

      # Requires Pages Source = GitHub Actions. Does not change repository settings.
      - uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install fixed dependencies
        run: |
          python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.13.5 PyYAML==6.0.3
          npm ci --ignore-scripts

      - name: Check collectors and publication guards offline
        run: |
          python scripts/check-rankings.py
          python scripts/check-chobirich-device-import.py
          python scripts/check-news.py
          python scripts/check-collector-fallbacks.py
          python scripts/check-publication.py

      # Push/manual publication never re-collects. The schedule collects each once.
      - name: Collect daily public data
        if: github.event_name == 'schedule'
        run: |
          python scripts/fetch-rankings.py
          python scripts/fetch-news.py

      - name: Import device-supplied Chobirich ranking
        if: github.event_name == 'workflow_dispatch' && (inputs.chobirich_html != '' || inputs.chobirich_base64 != '')
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import binascii
          import json
          import os
          from pathlib import Path

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
          inputs = event.get('inputs') or {}
          html = inputs.get('chobirich_html', '')
          encoded = inputs.get('chobirich_base64', '')
          if not isinstance(html, str) or not isinstance(encoded, str):
              raise SystemExit('invalid Chobirich device payload type')
          if bool(html.strip()) == bool(encoded.strip()):
              raise SystemExit('supply exactly one Chobirich device payload')
          target = Path(os.environ['RUNNER_TEMP']) / 'chobirich-ranking.html'
          if encoded.strip():
              try:
                  raw = base64.b64decode(encoded.strip(), validate=True)
              except (binascii.Error, ValueError) as exc:
                  raise SystemExit('invalid Base64 Chobirich device payload') from exc
              target.write_bytes(raw)
              mode = 'base64-raw'
          else:
              target.write_text(html, encoding='utf-8')
              mode = 'utf8-text'
          print(f'device payload saved: {target.stat().st_size} bytes ({mode})')
          PY
          python scripts/import-chobirich-ranking.py "$RUNNER_TEMP/chobirich-ranking.html"

      - name: Build and validate before saving or publishing
        run: |
          python build.py
          python check.py
          python scripts/check-seo.py
          python scripts/check-preservation.py
          node scripts/check-media.mjs
          python scripts/check-recommendation.py
          python scripts/publication.py verify

      # Uses the checkout's GITHUB_TOKEN: its push does not trigger another run.
      - name: Save validated data without overwriting concurrent edits
        run: python scripts/publication.py save

      - name: Add Search Console verification tag to deployed homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<meta name="google-site-verification" content="Hrh7MBSkbcyQGelakYCKkuacW5nHig9tVhBP22-JwA8" />'
          if tag not in text:
              if '<head>' not in text:
                  raise SystemExit('Homepage <head> not found')
              text = text.replace('<head>', '<head>' + tag, 1)
              p.write_text(text, encoding='utf-8')
          if tag not in p.read_text(encoding='utf-8'):
              raise SystemExit('Search Console verification tag injection failed')
          PY

      - name: Package the validated public directory
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
          retention-days: 1

      - name: Stop if main changed after validation
        run: python scripts/publication.py current

      - name: Publish the artifact in this run
        id: deployment
        uses: actions/deploy-pages@v4
