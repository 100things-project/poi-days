name: Daily point-site rankings

on:
  schedule:
    # GitHub Actions cron is UTC. 15:05 UTC = 00:05 JST.
    - cron: '5 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-point-site-rankings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir requests==2.32.5 beautifulsoup4==4.13.5

      - name: Check ranking parser offline
        run: python scripts/check-rankings.py

      - name: Fetch public rankings
        run: python scripts/fetch-rankings.py

      - name: Build site with verified snapshots
        run: python build.py

      - name: Validate daily recommendation
        run: python scripts/check-recommendation.py

      - name: Run existing checks
        run: python check.py

      - name: Show collector status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('content/live-rankings.json').read_text())
          for key,site in data.get('sites',{}).items():
              print(key, site.get('status'), site.get('checkedAt'), len(site.get('items',[])))
          PY

      - name: Commit refreshed ranking data
        run: |
          if git diff --quiet -- content/live-rankings.json docs dist; then
            echo "No ranking/build changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/live-rankings.json docs dist
          git commit -m "Refresh daily point-site rankings"
          git push
