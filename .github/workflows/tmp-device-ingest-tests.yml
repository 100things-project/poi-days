name: tmp device ranking ingest tests

on:
  push:
    branches: [feat/iphone-chobirich-ranking-ingest]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed Python dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.13.5 PyYAML==6.0.3
      - name: Run ranking and ingest regression checks
        run: |
          python scripts/check-rankings.py
          python scripts/check-chobirich-device-import.py
          python scripts/check-news.py
          python scripts/check-collector-fallbacks.py
          python scripts/check-publication.py
      - name: Parse production workflow YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          data=yaml.safe_load(Path('.github/workflows/site-refresh-deploy.yml').read_text())
          assert data
          print('PASS: production workflow YAML parses')
          PY
