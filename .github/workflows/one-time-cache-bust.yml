name: One-time ranking cache refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-cache-bust.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bust cached ranking data asset and rebuild
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('content/media-home.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('src="media-data.js"', 'src="media-data.js?v=20260911-2137"')
          p.write_text(s, encoding='utf-8')
          PY
          python build.py
      - name: Validate site
        run: python check.py
      - name: Commit refreshed outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/media-home.html docs dist
          git commit -m "Refresh ranking data cache key"
          git push
