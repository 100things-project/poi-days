name: Point-site NEWS refresh

on:
  # Scheduled runs only become active on the default branch.
  schedule:
    # GitHub Actions cron is UTC. 21:05 UTC = 06:05 JST.
    - cron: '5 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: point-site-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir requests==2.32.5 beautifulsoup4==4.13.5

      - name: Run offline NEWS parser checks first
        run: python scripts/check-news.py

      - name: Fetch official NEWS
        run: python scripts/fetch-news.py

      - name: Check collector fallbacks offline
        run: python scripts/check-collector-fallbacks.py

      - name: Build site
        run: python build.py

      - name: Run site checks
        run: python check.py

      - name: Show NEWS source status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('content/live-news.json').read_text())
          print('visible candidates:', len(data.get('items', [])))
          for key,source in data.get('sources',{}).items():
              print(key, source.get('status'), source.get('count'), source.get('fetchedAt'))
          PY

      # GITHUB_TOKEN pushes do not trigger branch-based Pages builds.
      # Publishing configuration must be reviewed before enabling on main.
      - name: Commit refreshed NEWS data
        run: |
          if git diff --quiet -- content/live-news.json docs dist; then
            echo "No NEWS/build changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/live-news.json docs dist
          git commit -m "Refresh point-site NEWS"
          git push
