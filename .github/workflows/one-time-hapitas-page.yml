name: One-time Hapitas page build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-hapitas-page.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build site
        run: python build.py
      - name: Validate site
        run: python check.py
      - name: Commit generated files
        run: |
          if git diff --quiet -- docs dist; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs dist
          git commit -m "Publish Hapitas referral page"
          git push
